<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Glooptic">
<title>Glooptic · Óptica</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f9fafb; --ink:#101828; --ink-2:#344054; --muted:#667085;
  --line:#e4e7ec; --line-2:#f2f4f7; --brand:#ffffff; --brand-2:#f9fafb; --accent:#2563eb; --accent-2:#1d4ed8;
  --accent-soft:#eff4ff; --gold:#f79009; --gold-soft:#fffaeb; --danger:#d92d20; --danger-soft:#fef3f2;
  --ok:#079455; --ok-soft:#ecfdf3; --warn:#dc6803; --warn-soft:#fffaeb;
  --radius:12px; --radius-sm:8px; --shadow:0 1px 2px rgba(16,24,40,.05);
  --serif:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --primary:#2563eb; --primary-2:#1d4ed8; --ink-soft:#f2f4f7; --gold-ink:#93370d; --glass:rgba(255,255,255,.88);
  --hover-line:#d0d5dd; --glow1:#e8efff; --glow2:#f3f0ff; --backdrop:rgba(16,24,40,.4); --toast:#101828;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.02em;margin:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100dvh}
.side{background:var(--brand);color:var(--ink-2);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:var(--safe-top);height:calc(100dvh - var(--safe-top) - var(--safe-bottom));display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:#1c1c1b;display:grid;place-items:center;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand .logo svg{width:24px;height:24px;color:#fff}
.brand b{font-family:var(--serif);font-size:17px;color:var(--ink);font-weight:600;display:block;line-height:1.1}
.brand small{font-size:12px;color:var(--muted)}
.nav a{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:8px;color:var(--ink-2);font-weight:500;font-size:14.5px}
.nav a svg{width:19px;height:19px;color:var(--muted)}
.nav a:hover{background:var(--line-2);color:var(--ink)}
.nav a.on{background:var(--line-2);color:var(--ink);font-weight:600}
.nav a .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px}
.tile{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--c);flex:none}
.nav a .tile svg,.mobile-bar a .tile svg,.list-item .tile svg{width:17px;height:17px;color:#fff;opacity:1}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.side .me > div:not(.avatar){flex:1;min-width:0}
.side .me b{display:block;color:var(--ink);font-size:14px}
.side .me small{color:var(--muted);font-size:12px}
.side .me button{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px}
.side .me button:hover{color:var(--ink);background:var(--line-2)}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:14px 32px;border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);position:sticky;top:var(--safe-top);z-index:20}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;border:1px solid var(--hover-line);background:var(--surface);border-radius:8px;padding:9px 14px 9px 40px;outline:none;box-shadow:var(--shadow)}
.search input:focus{border-color:#84adff;box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.top .date{margin-left:auto;color:var(--muted);font-size:13.5px;white-space:nowrap}
.cap::first-letter{text-transform:uppercase}
.content{padding:28px 32px 60px;max-width:1240px;width:100%}
.mobile-bar{display:none}

/* ---------- Components ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:26px}
.page-head p{margin:4px 0 0;color:var(--muted)}
.crumb{color:var(--muted);font-size:13px;margin-bottom:6px;display:inline-flex;gap:6px;align-items:center}
.crumb:hover{color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--hover-line);background:var(--surface);color:var(--ink-2);padding:9px 15px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:.15s;box-shadow:var(--shadow)}
.btn svg{width:17px;height:17px}
.btn:hover{background:var(--surface-2);color:var(--ink)}
.btn:focus-visible,.nav a:focus-visible,.seg button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.accent:hover{background:var(--accent-2)}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--line-2)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.sm svg{width:15px;height:15px}
.btn.icon{padding:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 0}
.card-h h3{font-size:16px}
.card-h .sub{color:var(--muted);font-size:13px}
.card-b{padding:18px 20px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}

.kpi{padding:18px 20px}
.kpi .l{color:var(--muted);font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.kpi .l i{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.kpi .l i svg{width:16px;height:16px}
.kpi .v{font-family:var(--serif);font-size:26px;font-weight:600;margin-top:12px;letter-spacing:-.02em}
.kpi .s{color:var(--muted);font-size:12.5px;margin-top:2px}
.kpi.gold .l i{background:var(--gold-soft);color:var(--gold)}
.kpi.warn .l i{background:var(--warn-soft);color:var(--warn)}
.kpi.ink .l i{background:var(--ink-soft);color:var(--ink)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;letter-spacing:.01em;color:var(--muted);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
.tbl-wrap{overflow-x:auto}
.show-sm{display:none}
tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}

.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.pend{background:var(--warn-soft);color:var(--warn)}
.chip.listo{background:var(--accent-soft);color:var(--accent-2)}
.chip.entr{background:var(--ok-soft);color:var(--ok)}
.chip.deuda{background:var(--danger-soft);color:var(--danger)}
.chip.plain{background:var(--line-2);color:var(--ink-2)}
.chip.plain::before{display:none}
.tag{display:inline-block;white-space:nowrap;padding:2px 8px;border-radius:6px;background:var(--line-2);font-size:12px;font-weight:600;color:var(--ink-2)}
.muted{color:var(--muted)}
.small{font-size:13px}
.strong{font-weight:600}
.empty{text-align:center;color:var(--muted);padding:36px 16px}
.empty svg{width:36px;height:36px;opacity:.4;margin-bottom:8px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.mt{margin-top:18px}
.mt-s{margin-top:10px}
.list-item{display:flex;align-items:center;gap:14px;padding:12px 20px;border-top:1px solid var(--line-2)}
.list-item:first-child{border-top:0}
.list-item.link{cursor:pointer}
.list-item.link:hover{background:var(--surface-2)}
.list-item .grow{flex:1;min-width:0}
.list-item .t{font-weight:600;display:block}
.list-item .d{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item > *{flex:none}
.list-item > .grow{flex:1}
.main{overflow-x:clip}
.ini{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.ordnum{font-family:var(--serif);font-weight:600;color:var(--ink);font-size:15px}

/* Rx table */
.rx{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rx th,.rx td{text-align:center;padding:9px 8px;border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums}
.rx th{background:var(--surface-2);font-size:11px}
.rx td:first-child,.rx th:first-child{text-align:left;font-weight:700;color:var(--ink);padding-left:14px}
.rx tr:last-child td{border-bottom:0}
.rx .chg{color:var(--danger);font-weight:700}
.rx-card{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--surface)}
.rx-card + .rx-card{margin-top:12px}
.rx-card.latest{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dx{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* Forms */
.form{display:grid;gap:14px}
.fg{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fg4{grid-template-columns:repeat(4,minmax(0,1fr))}
.full{grid-column:1/-1}
.span2{grid-column:span 2}
label.f{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--hover-line);background:var(--surface);border-radius:8px;padding:10px 12px;outline:none;font-weight:400;font-size:15px;box-shadow:var(--shadow)}
.inp:focus{border-color:#84adff;box-shadow:0 0 0 4px var(--accent-soft)}
textarea.inp{min-height:76px;resize:vertical}
.inp.sm{padding:7px 9px;font-size:14px}
.rx-in{width:100%;border-collapse:collapse}
.rx-in th{padding:6px;text-align:center;border:0}
.rx-in td{padding:4px;border:0}
.rx-in td:first-child{font-weight:700;color:var(--ink);width:44px}
.rx-in .inp{text-align:center;padding:9px 4px}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.seg{display:inline-flex;background:var(--line-2);border:1px solid var(--line);padding:3px;border-radius:10px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.1),0 1px 2px rgba(16,24,40,.06)}
.pay-opts{display:flex;gap:8px;flex-wrap:wrap}
.pay-opts label{cursor:pointer}
.pay-opts input{display:none}
.pay-opts span{display:inline-block;padding:8px 14px;border:1px solid var(--hover-line);border-radius:8px;font-weight:600;font-size:13.5px;background:var(--surface)}
.pay-opts input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2)}
.fld{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.fld[hidden]{display:none}
.lcolor{display:grid;gap:10px;padding-top:10px;border-top:1px dashed var(--line)}
.lcolor[hidden]{display:none}
.lcolor .seg{justify-self:start}
.pick button svg{width:14px;height:14px}
.inp.up{text-transform:uppercase}
.pick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pick button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--hover-line);background:var(--surface);border-radius:8px;padding:7px 11px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer}
.pick button small{font-size:11px;font-weight:700;color:var(--muted)}
.pick button i{font-style:normal;font-size:11px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff}
.pick button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2)}
.pick button.on small{color:var(--accent-2)}
.sigla{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.02em}
.sigla-box{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:10px;background:var(--accent-soft);color:var(--accent-2);border:1px solid #c7d7fe}
.sigla-box .small{opacity:.7}
.sigla-box b{font-size:19px;text-align:right;overflow-wrap:anywhere}
.lpanel{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:12px;padding:14px;border:1px solid var(--accent);border-radius:12px;background:var(--surface-2)}
.lpanel select{width:100%;min-width:0}
.tgrupo{font-size:18px;margin:22px 0 10px}
.tgrupo:first-of-type{margin-top:6px}
.tarifa{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.tprec{margin-top:8px}
.tprec th,.tprec td{padding:7px 10px;font-size:13.5px}
.tprec th{white-space:nowrap}
.tedit th,.tedit td{padding:4px;border:0;vertical-align:middle}
.tedit .inp{min-width:84px;padding:7px 8px}
.tedit th:nth-child(2) .inp,.tedit th:nth-child(3) .inp,.tedit td:nth-child(2) .inp,.tedit td:nth-child(3) .inp{min-width:64px;width:64px}
.abl{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.abr{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;gap:6px;align-items:center}

.items td{padding:6px}
.items .inp{padding:8px}
.totals{display:grid;gap:8px;min-width:260px}
.totals div{display:flex;justify-content:space-between;gap:20px}
.totals .big{font-family:var(--serif);font-size:21px;font-weight:600;border-top:1px solid var(--line);padding-top:10px}

/* Caja */
.cash-sum{display:grid;gap:10px}
.cash-sum .line{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.cash-sum .line.total{border-top:1px dashed var(--line);padding-top:12px;font-weight:700;font-size:16px}
.partner{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--surface-2)}
.partner .v{font-family:var(--serif);font-size:26px;font-weight:600;margin-top:4px}
.method-bar{display:flex;height:10px;border-radius:10px;overflow:hidden;background:var(--line-2);gap:2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.locked{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:var(--gold-soft);color:var(--gold-ink);font-weight:500;font-size:14px}
.locked svg{width:18px;height:18px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:var(--backdrop);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:100;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.35);animation:pop .18s}
.modal.wide{max-width:860px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 0}
.modal-h h3{font-size:18px}
.modal-b{padding:18px 22px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:0 22px 20px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.toast{position:fixed;bottom:calc(24px + var(--safe-bottom));left:50%;transform:translateX(-50%);background:var(--toast);color:#fff;padding:12px 18px;border-radius:12px;font-weight:500;z-index:200;box-shadow:var(--shadow);animation:pop .2s}
.lock-note{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--gold-soft);color:var(--gold-ink);font-size:13.5px;margin-bottom:14px}
.lock-note svg{width:18px;height:18px;flex:none;margin-top:1px}

/* Login */
.login{min-height:calc(100dvh - var(--safe-top) - var(--safe-bottom));display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 600px at 10% -10%,var(--glow1) 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,var(--glow2) 0,transparent 60%),var(--bg)}
.login .box{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:34px;box-shadow:0 12px 16px -4px rgba(16,24,40,.08),0 4px 6px -2px rgba(16,24,40,.03)}
.login .box.wide{max-width:560px}
.login .logo{width:56px;height:56px;border-radius:14px;background:#1c1c1b;display:grid;place-items:center;margin-bottom:18px;overflow:hidden}
.login .logo svg{width:30px;height:30px;color:#fff}
.login h1{font-size:24px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 14px}
.who button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:16px;cursor:pointer;display:grid;justify-items:center;gap:8px;font-weight:600}
.who button.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.who .avatar{width:44px;height:44px;font-size:17px}
.who button.on .avatar{background:var(--accent);color:#fff}
.pin{letter-spacing:.5em;text-align:center;font-size:22px !important}
.err{color:var(--danger);font-size:13.5px;min-height:20px;margin-top:8px}

/* Search dropdown */
.sr{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 16px -4px rgba(16,24,40,.08),0 4px 6px -2px rgba(16,24,40,.03);max-height:420px;overflow:auto;z-index:50}
.sr .grp{padding:10px 14px 4px;font-size:12px;color:var(--muted);font-weight:700}
.sr a{display:flex;gap:10px;align-items:center;padding:9px 14px}
.sr a:hover,.sr a.hl{background:var(--surface-2)}
.sr .grow{flex:1;min-width:0}
.sr.static{position:static;margin-top:8px;box-shadow:none;max-height:300px}

#print{display:none}
@media print{
  body{background:#fff}
  .app,.login,.modal-bg,.toast{display:none !important}
  #print{display:block;font:12px/1.45 var(--sans);color:#000}
}
.nota{max-width:720px;margin:0 auto;padding:10px}
.nota h2{font-size:22px}
.nota .hd{display:flex;justify-content:space-between;border-bottom:2px solid #14263f;padding-bottom:10px;margin-bottom:12px}
.nota table{margin-top:10px}
.nota th,.nota td{padding:6px 8px;border-bottom:1px solid #ddd;font-size:12px}
.nota .rx th,.nota .rx td{border-bottom:1px solid #ddd}

/* ---------- Responsive ---------- */
/* Tablet horizontal / laptop chico: barra lateral compacta de íconos */
@media (min-width:901px) and (max-width:1180px){
  .app{grid-template-columns:84px minmax(0,1fr)}
  .side{padding:18px 12px;align-items:center}
  .brand{padding:4px 0 18px}
  .brand > div:last-child,.nav a span:not(.badge):not(.tile),.side .me > div:not(.avatar),.side .me button{display:none}
  .nav{display:grid;gap:4px}
  .nav a{position:relative;justify-content:center;width:56px;height:50px;padding:0}
  .nav a .tile{width:34px;height:34px}
  .nav a .tile svg{width:19px;height:19px}
  .nav a svg{width:22px;height:22px}
  .nav a .badge{position:absolute;top:4px;right:4px;margin:0;padding:0 5px;font-size:10px}
  .side .me{padding:8px;background:none;cursor:pointer}
  .content{padding:24px 24px 60px}
  .top{padding:14px 24px}
}
@media (max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split,.g2{grid-template-columns:minmax(0,1fr)}
  .partner-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
}
/* Tablet vertical y teléfono: barra inferior */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top{padding:12px 16px}
  .top .date{display:none}
  .content{padding:18px 16px calc(100px + var(--safe-bottom))}
  .page-head h1{font-size:22px}
  .mobile-bar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-bottom));z-index:30}
  .mobile-bar a{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;position:relative}
  .mobile-bar a .tile{width:30px;height:30px;opacity:.55}
  .mobile-bar a.on{color:var(--ink)}
  .mobile-bar a.on .tile{opacity:1}
  .mobile-bar .badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--accent);color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:0 5px}
}
@media (min-width:901px){.top .me-m{display:none}}
@media (min-width:641px) and (max-width:900px){
  .content{padding:22px 24px calc(100px + var(--safe-bottom))}
  .top{padding:12px 24px}
  .search{max-width:none}
}
/* Pantallas táctiles: botones más grandes y texto de 16px para que el iPhone no haga zoom */
@media (pointer:coarse){
  .btn{min-height:44px}
  .btn.sm{min-height:38px}
  .btn.icon{min-width:44px}
  .inp,.inp.sm,select.inp,textarea.inp,.search input{font-size:16px}
  .seg button{padding:9px 14px}
  .pay-opts span{padding:10px 16px}
  .pick button{padding:9px 12px}
  tbody tr.link td{padding-top:14px;padding-bottom:14px}
}
@media (max-width:640px){
  .g2,.g3,.fg,.fg3{grid-template-columns:minmax(0,1fr)}
  .fg4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span2{grid-column:auto}
  .toast{bottom:auto;top:calc(12px + var(--safe-top));max-width:calc(100% - 32px)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .grid{gap:12px}
  .kpi{padding:14px}
  .kpi .v{font-size:21px}
  .kpi .l{font-size:12px}
  .card-h,.card-b{padding-left:14px;padding-right:14px}
  .list-item{padding:12px 14px;gap:10px}
  .list-item .ordnum{min-width:0 !important;font-size:14px}
  .hide-sm{display:none}
  .show-sm{display:inline}
  .page-head{margin-bottom:16px}
  .page-head .actions{width:100%}
  .page-head .actions .btn{flex:1 1 auto}
  td,th{padding:10px 8px}
  .rx th,.rx td{padding:8px 3px;font-size:13.5px}
  .rx th{font-size:10px;letter-spacing:.02em}
  .rx-card{padding:12px}
  .rx td:first-child,.rx th:first-child{padding-left:10px}
  /* productos de la venta en tarjetas apiladas */
  .items thead{display:none}
  .items tbody tr{display:grid;grid-template-columns:70px minmax(0,1fr) auto 44px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
  .items td{padding:0;border:0}
  .items td:first-child{grid-column:1/-1}
  .items td.empty{grid-column:1/-1}
  /* ventanas como hoja inferior */
  .modal-bg{place-items:end center;padding:0}
  .modal{max-width:none;border-radius:16px 16px 0 0;max-height:92dvh;padding-bottom:var(--safe-bottom);animation:sheet .22s}
  .modal-h{padding:18px 16px 0}
  .modal-b{padding:16px}
  .modal-f{padding:0 16px 16px;flex-wrap:wrap}
  .modal-f .btn{flex:1}
  .login .box{padding:26px 20px}
  .who button{padding:12px}
}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="print"></div>
<script src="app.js?v=2026.09.23.9"></script>
